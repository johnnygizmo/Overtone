name: overtone_spikes
description: Throwaway Phase 0 technical spikes (see Planning/MILESTONES.md M1). Not shipped.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  markdown: ^7.3.1
  music_domain: any
  overtone_content: any
  sembast_web: ^2.4.7
  web: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/media/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-regular.ttf
        - asset: assets/fonts/Roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-italic.ttf
          style: italic
