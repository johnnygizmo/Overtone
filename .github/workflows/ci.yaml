name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check dependency directions
        run: dart run tools/check_deps.dart

      - name: Test pure Dart packages
        run: |
          for d in packages/music_domain packages/overtone_content packages/exercise_engine packages/learner_model tools/overtone_cli; do
            (cd "$d" && dart test)
          done

      - name: Test content parser in Chrome (dart2js and Wasm)
        run: |
          cd packages/overtone_content
          dart test -p chrome
          dart test -p chrome -c dart2wasm

      - name: Test web app
        run: cd apps/overtone_web && flutter test

      - name: Build web app
        run: cd apps/overtone_web && flutter build web --release --base-href /Overtone/
